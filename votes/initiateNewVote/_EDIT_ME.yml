# To initiate a new vote, you need to open a PR modifying this file. The vote
# can start once the PR has approvals and is merged via the GitHub interface.

# 1. Select a subject for the vote. This can be a question addressed to the
#    voting members.
subject: Pride Month 2025

# 2. You can leave the header instructions as is, or modify them if you see fit.
headerInstructions: |
  Please set a score to each proposal according to your preferences.
  You should set the highest score to your favorite option.
  Negative scores are allowed, only the order matters.
  You can tie two or more proposals if you have no preference.
  To abstain, keep all the propositions tied.

# 3. Give a list of "candidates". Those should be answers to the subject
#    question, and should leave as little room to interpretation as possible. Do
#    not list candidates that don't have a champion, there should be a
#    clear plan for each candidates in the event where it wins the vote; listing
#    a "troll candidate" will only hurt the credibility of the voting process if
#    it wins and everyone realize we have to re-take the vote because it can't
#    happen. Don't hesitate to list very similar candidates, with however small
#    nuances: we are using the Condorcet method to count the votes, which lets
#    voters express their preference for each candidates, no matter how many
#    there are.
candidates:
  - Do not take any action for Pride Month.
  - |
    Worldwide logo, no blog posts:
    
    - Change the logo on the website (on pages where it appears today, i.e. not on documentation pages) without any IP restriction.
    - Create a public lock issue asking folks that have a problem with it to write to report@nodejs.org.
    - No particular action to take on the blog.
  - |
    Logo for some selected places, no blog posts:
    
    - Change the logo on the website (on pages where it appears today, i.e. not on documentation pages) with IP restriction (allowlist, only some geographical areas would be served the "Pride" logo).
    - Create a public lock issue asking folks that have a problem with it to write to report@nodejs.org.
    - No particular action to take on the blog.
  - |
    Logo except some selected places, no blog posts:
    
    - Change the logo on the website (on pages where it appears today, i.e. not on documentation pages) with IP restriction (denylist, some geographical areas would not be served the "Pride" logo).
    - Create a public lock issue asking folks that have a problem with it to write to report@nodejs.org.
    - No particular action to take on the blog.
  - |
    Worldwide logo + blog posts:
    
    - Change the logo on the website (on pages where it appears today, i.e. not on documentation pages) without any IP restriction.
    - Publish a series of blog posts outlining contributions from voluntary LGBT+ contributors.
    - Create a public lock issue asking folks that have a problem with it to write to report@nodejs.org.
  - |
    Logo for some selected places + blog posts:
    
    - Change the logo on the website (on pages where it appears today, i.e. not on documentation pages) with IP restriction (allowlist, only some geographical areas would be served the "Pride" logo).
    - Publish a series of blog posts outlining contributions from voluntary LGBT+ contributors.
    - Create a public lock issue asking folks that have a problem with it to write to report@nodejs.org.
  - |
    Logo except some selected places + blog posts:
    
    - Change the logo on the website (on pages where it appears today, i.e. not on documentation pages) with IP restriction (denylist, some geographical areas would not be served the "Pride" logo).
    - Publish a series of blog posts outlining contributions from voluntary LGBT+ contributors.
    - Create a public lock issue asking folks that have a problem with it to write to report@nodejs.org.
  - |
    Blog posts only:
    
    - Publish a series of blog posts outlining contributions from voluntary LGBT+ contributors.
    - Create a public lock issue asking folks that have a problem with it to write to report@nodejs.org.
    - Do not change the logo on the website.

# 4. Pass the following to false if it's important to keep the candidates in the
#    order you define above. Presenting candidates in a fixed order tends to
#    give an unfair advantage to the first option.
canShuffleCandidates: true

# 5. Insert here a short description of the vote objectives and link to the
#    issue it was discussed on to give the full context.
footerInstructions: |
  Pride month refers to showing support for the LGBT+ community during the month of June.
  Whichever option arrives on top, it would be valid only for June 2025.

# 6. Optionally, insert a brief introduction for the vote PR, in the markdown format.
prBody: |
  This vote is open to all members of nodejs GitHub org. The vote will be open until 2025-06-05.
  To make voting easier, the repository the vote is taking place in public,
  which means the information of who participated to the vote will be public,
  however what you voted for will only be accessible to TSC voting members.
  TSC members shall not access the content of the ballots except to count
  them once the vote has closed.
  
  Refs: https://github.com/nodejs/moderation/issues/853

# 7. Optionally, choose an id that will be used for the branch name as well as
#    the vote folder name. If not supplied, a UUID will be used.
path-friendly-id: pride-month-2025

# 8. Optionally, define the secret holders, if you want the ballots to stay
#    secret until the vote closes. If no secret holders, the public key will
#    accessible as soon as the vote opens. The expected format is a list of
#    strings parsable by GPG.
