# To initiate a new vote, you need to open a PR modifying this file. The vote
# can start once the PR has approvals and is merged via the GitHub interface.

# 1. Select a subject for the vote. This can be a question addressed to the TSC
#    voting members.
subject: Node.js Mascot Voting

# 2. You can leave the header instructions as is, or modify them if you see fit.
headerInstructions: |
  Please set a score to proposal according to your preferences.
  You should set the highest score to your favorite option.
  Negative scores are allowed, only the order matters.
  You can tie two or more proposals if you have no preference.
  To abstain, keep all the propositions tied.

# 3. Give a list of "candidates". Those should be answers to the subject
#    question, and should leave as little room to interpretation as possible. Do
#    not list candidates that don't have a champion, there should be a
#    clear plan for each candidates in the event where it wins the vote; listing
#    a "troll candidate" will only hurt the credibility of the voting process if
#    it wins and everyone realize we have to re-take the vote because it can't
#    happen. Don't hesitate to list very similar candidates, with however small
#    nuances: we are using the Condorcet method to count the votes, which lets
#    voters express their preference for each candidates, no matter how many
#    there are.
candidates:
  - ![Green turtle wearing an aviator hat with glasses on top of the head](https://github.com/aduh95/collaborators-public-votes/raw/mascot-election/assets/a49f3a87-f681-4211-a9a7-4e66db43ae31.png)
  - ![Black spider on a black web with green background](https://github.com/aduh95/collaborators-public-votes/raw/mascot-election/assets/a82b2374-7765-4703-81cf-974676971f49.png)
  - ![Green bee with black stripes and wings, eyes are shaped like the Node.js logo](https://github.com/aduh95/collaborators-public-votes/raw/mascot-election/assets/b71cec0e-dfdb-49c7-8aac-cc1d87f965b1.png)
  - ![Turtle standing up on a rocket, wearing a baseball cap](https://github.com/aduh95/collaborators-public-votes/raw/mascot-election/assets/01413d58-9bca-45d3-9117-260641013717.png)
  - ![Turtle with a propeller straped to its shell](https://github.com/aduh95/collaborators-public-votes/raw/mascot-election/assets/e32b03f7-ce00-432c-bf0f-8c23765e9b72.png)
  - ![Bee with a green and grey body, loosely shaped like the Node.js logo](https://github.com/aduh95/collaborators-public-votes/raw/mascot-election/assets/5c602db9-98bb-4e69-88b0-ce1449c754a4.png)
  - ![Bee with large antennas and an olive green colored body](https://github.com/aduh95/collaborators-public-votes/raw/mascot-election/assets/1e80efb6-0f17-4be9-9b6b-f9d72ba10648.png)
  - ![Green frog with a big smile](https://github.com/aduh95/collaborators-public-votes/raw/mascot-election/assets/e5d03fb2-e600-4178-97d3-7b3b7c92824e.png)

# 4. Pass the following to false if it's important to keep the candidates in the
#    order you define above. Presenting candidates in a fixed order tends to
#    give an unfair advantage to the first option.
canShuffleCandidates: true

# 5. Insert here a short description of the vote objectives and link to the
#    issue it was discussed on to give the full context.
footerInstructions: |
  A few reminders: 
  - To ensure no biases, usernames are omitted from the designs.
  - The design will be touched up/brought to life by the Linux Foundation design team.
    So don’t worry about overall quality, just the concept! We will work with the
    person who created the concept to ensure integrity.
  - Only Node.js Collaborators may vote. This will be cross-checked against the list.

# 6. Optionally, insert a brief introduction for the vote PR, in the markdown format.
prBody: |
  This is a test PR for the upcoming mascot election for Node.js. Make sure to
  vote using the email address associated with your GitHub account in the
  Node.js README.

# 7. Optionally, choose an id that will be used for the branch name as well as
#    the vote folder name. If not supplied, a UUID will be used.
path-friendly-id: null
