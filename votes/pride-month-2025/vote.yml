subject: Pride Month 2025
headerInstructions: |
  Please set a score to each proposal according to your preferences.
  You should set the highest score to your favorite option.
  Negative scores are allowed, only the order matters.
  You can tie two or more proposals if you have no preference.
  To abstain, keep all the propositions tied.
candidates:
  - Do not take any action for Pride Month.
  - >-
    Change the logo on the website (on pages where it appears today, i.e. not on
    documentation pages), create a public lock issue asking folks that have a
    problem with it to write to report@nodejs.org.
  - >-
    Publish a series of blog posts outlining contributions from voluntary LGBT+
    contributors.
  - >-
    Change the logo AND publish a series of blog posts outlining contributions
    from voluntary LGBT+ contributors.
  - >-
    Serve a different logo based on the visitor IP address (based on location,
    it would be either the rainbow-colored logo or the classic one).
  - >-
    Serve a different logo based on the visitor IP address and publish a series
    of blog post.
footerInstructions: >
  Pride month refers to showing support for the LGBT+ community during the month
  of June.

  Whichever option arrives on top, it would be valid only for June 2025.
