footerInstructions: >
  A few reminders: 

  - To ensure no biases, usernames are omitted from the designs.

  - The design will be touched up/brought to life by the Linux Foundation design
  team.
    So don’t worry about overall quality, just the concept! We will work with the
    person who created the concept to ensure integrity.
  - Only Node.js Collaborators may vote. This will be cross-checked against the
  list.
